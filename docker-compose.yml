services:
  db:
    image: postgres:16
    container_name: rmml-postgres
    environment:
      POSTGRES_DB: rmml
      POSTGRES_USER: rmml
      POSTGRES_PASSWORD: rmml
    ports:
      - "5432:5432"
    volumes:
      - rmml_pgdata:/var/lib/postgresql/data
      - ./etape04/schema.sql:/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmml -d rmml"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rmml_pgdata:
